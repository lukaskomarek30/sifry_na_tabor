name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Verze bez pismene v, napr. 0.0.1"
        required: true
        default: "0.0.1"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-26
          - platform: macos-x64
            os: macos-26-intel

    steps:
      - name: Stahnout repozitar
        uses: actions/checkout@v6

      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Nainstalovat knihovny
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 Pillow

      - name: Spustit build_release.py
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          printf "%s\n" "$VERSION" | python build_release.py

      - name: Najit ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_PATH="$(find release -type f -name '*.zip' | head -n 1)"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Nalezen ZIP: $ZIP_PATH"

      - name: Nahrat ZIP do GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Nova verze $VERSION."
          fi

          gh release upload "$TAG" "$ZIP_PATH" --clobber

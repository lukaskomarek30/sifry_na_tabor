# Workflow pro sestavení a vydání nové verze aplikace Šifrátor Mraveniště.
#
# Workflow se spouští ručně přes GitHub Actions a vytvoří samostatné buildy pro:
# - Windows x64
# - macOS Apple Silicon / ARM64
# - macOS Intel / x64
#
# Po úspěšném sestavení se ZIP balíčky nahrají do GitHub Release
# a současně se aktualizuje soubor update.json pro automatické aktualizace aplikace.

name: Build release

on:
  # Ruční spuštění workflow z GitHub Actions.
  # Verze se zadává bez písmene "v", protože tag se vytváří až později ve tvaru vX.Y.Z.
  workflow_dispatch:
    inputs:
      version:
        description: "Verze bez písmene v, například 0.0.5"
        required: true
        default: "0.0.5"

# Workflow potřebuje právo zapisovat do repozitáře a spravovat GitHub Release assety.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Při chybě jedné platformy se ostatní buildy nechají doběhnout.
      # Díky tomu je hned vidět, jestli problém nastal jen na jedné platformě.
      fail-fast: false

      # Každá položka matrixu vytvoří samostatný build pro konkrétní operační systém.
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest

          - platform: macos-arm64
            os: macos-26

          - platform: macos-x64
            os: macos-26-intel

    steps:
      # Stažení kompletního zdrojového kódu repozitáře do runneru.
      - name: Stáhnout repozitář
        uses: actions/checkout@v6

      # Nastavení jednotné verze Pythonu pro všechny platformy.
      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Diagnostický výpis prostředí.
      # Pomáhá rychle ověřit, na jaké platformě build skutečně běží.
      - name: Zobrazit systém
        shell: bash
        run: |
          echo "Platforma: ${{ matrix.platform }}"
          python --version
          python -c "import platform; print(platform.system(), platform.machine())"

      # Instalace buildovacích závislostí.
      # PyInstaller vytváří aplikaci, PySide6 je UI framework a Pillow se používá pro práci s ikonami/obrázky.
      - name: Nainstalovat knihovny
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 Pillow

      # Spuštění lokálního buildovacího skriptu.
      # Verze se předává přes standardní vstup, protože build_release.py ji očekává jako interaktivní vstup.
      - name: Spustit build_release.py
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          printf "%s\n" "$VERSION" | python build_release.py

      # Vyhledání přesného ZIP balíčku pro aktuální platformu.
      # Do artifactu se ukládá jen správný release ZIP, aby se do publikace nedostaly pomocné soubory.
      - name: Najít správný release ZIP
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "Všechny ZIP soubory:"
          find release -type f -name "*.zip" || true

          ZIP_PATH="$(find release -type f -name "Sifrator_Mraveniste*${PLATFORM}*_v${VERSION}.zip" | head -n 1)"

          if [ -z "$ZIP_PATH" ]; then
            echo "CHYBA: Nebyl nalezen správný release ZIP pro platformu ${PLATFORM}."
            echo "Hledaný vzor: Sifrator_Mraveniste*${PLATFORM}*_v${VERSION}.zip"
            exit 1
          fi

          mkdir -p upload
          cp "$ZIP_PATH" "upload/$(basename "$ZIP_PATH")"

          echo "Správný ZIP:"
          ls -lh upload/

      # Uložení ZIPu jako artifact.
      # Publish job si později stáhne všechny platformní artifacty a vytvoří z nich GitHub Release.
      - name: Uložit ZIP jako artifact pro finální upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: upload/*.zip
          if-no-files-found: error

  publish:
    name: Publish release and update.json
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Repozitář se stahuje znovu, protože publish job běží v samostatném runneru.
      - name: Stáhnout repozitář
        uses: actions/checkout@v6

      # Stažení ZIP artifactů vytvořených v build jobu.
      - name: Stáhnout ZIPy z buildu
        uses: actions/download-artifact@v4
        with:
          path: all-zips
          merge-multiple: true

      # Kontrola, že existují všechny tři požadované platformní balíčky.
      # Současně se vypočítají SHA256 hashe pro update.json.
      - name: Zkontrolovat ZIPy
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Stažené ZIPy:"
          find all-zips -type f -name "*.zip" -print

          WIN_ZIP="$(find all-zips -type f -name "Sifrator_Mraveniste*windows-x64*_v${VERSION}.zip" | head -n 1)"
          MAC_ARM_ZIP="$(find all-zips -type f -name "Sifrator_Mraveniste*macos-arm64*_v${VERSION}.zip" | head -n 1)"
          MAC_X64_ZIP="$(find all-zips -type f -name "Sifrator_Mraveniste*macos-x64*_v${VERSION}.zip" | head -n 1)"

          if [ -z "$WIN_ZIP" ]; then
            echo "CHYBA: Chybí Windows ZIP."
            exit 1
          fi

          if [ -z "$MAC_ARM_ZIP" ]; then
            echo "CHYBA: Chybí macOS ARM64 ZIP."
            exit 1
          fi

          if [ -z "$MAC_X64_ZIP" ]; then
            echo "CHYBA: Chybí macOS x64 ZIP."
            exit 1
          fi

          echo "WIN_ZIP=$WIN_ZIP" >> "$GITHUB_ENV"
          echo "MAC_ARM_ZIP=$MAC_ARM_ZIP" >> "$GITHUB_ENV"
          echo "MAC_X64_ZIP=$MAC_X64_ZIP" >> "$GITHUB_ENV"

          echo "WIN_NAME=$(basename "$WIN_ZIP")" >> "$GITHUB_ENV"
          echo "MAC_ARM_NAME=$(basename "$MAC_ARM_ZIP")" >> "$GITHUB_ENV"
          echo "MAC_X64_NAME=$(basename "$MAC_X64_ZIP")" >> "$GITHUB_ENV"

          echo "WIN_SHA=$(sha256sum "$WIN_ZIP" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "MAC_ARM_SHA=$(sha256sum "$MAC_ARM_ZIP" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "MAC_X64_SHA=$(sha256sum "$MAC_X64_ZIP" | awk '{print $1}')" >> "$GITHUB_ENV"

      # Vytvoření update.json pro automatický updater v aplikaci.
      # package_url odkazuje na ZIP soubory v GitHub Release a sha256 slouží ke kontrole integrity.
      - name: Vytvořit update.json
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          repo = os.environ["REPOSITORY"]
          tag = f"v{version}"
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          data = {
              "version": version,
              "notes": f"Nová verze {version}.",
              "platforms": {
                  "windows-x64": {
                      "package_url": f"{base_url}/{os.environ['WIN_NAME']}",
                      "sha256": os.environ["WIN_SHA"],
                      "file_name": os.environ["WIN_NAME"],
                  },
                  "macos-arm64": {
                      "package_url": f"{base_url}/{os.environ['MAC_ARM_NAME']}",
                      "sha256": os.environ["MAC_ARM_SHA"],
                      "file_name": os.environ["MAC_ARM_NAME"],
                  },
                  "macos-x64": {
                      "package_url": f"{base_url}/{os.environ['MAC_X64_NAME']}",
                      "sha256": os.environ["MAC_X64_SHA"],
                      "file_name": os.environ["MAC_X64_NAME"],
                  },
              },
          }

          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      # Vytvoření GitHub Release, pokud pro daný tag ještě neexistuje.
      # Pokud release existuje, workflow ho použije a jen aktualizuje assety.
      - name: Vytvořit nebo najít GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG už existuje."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Nová verze $VERSION."
          fi

      # Odstranění starých nebo chybných assetů před nahráním nové verze.
      # Příkaz je tolerantní k neexistujícím assetům, aby workflow nespadl při prvním vydání.
      - name: Smazat špatné nebo staré assety v Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"

          gh release delete-asset "$TAG" "base_library.zip" -y || true

          gh release delete-asset "$TAG" "$WIN_NAME" -y || true
          gh release delete-asset "$TAG" "$MAC_ARM_NAME" -y || true
          gh release delete-asset "$TAG" "$MAC_X64_NAME" -y || true
          gh release delete-asset "$TAG" "update.json" -y || true

      # Nahrání finálních ZIP balíčků a update.json do GitHub Release.
      # Parametr --clobber povolí přepsání assetu, pokud by už existoval.
      - name: Nahrát správné ZIPy do GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"

          gh release upload "$TAG" "$WIN_ZIP" --clobber
          gh release upload "$TAG" "$MAC_ARM_ZIP" --clobber
          gh release upload "$TAG" "$MAC_X64_ZIP" --clobber
          gh release upload "$TAG" update.json --clobber

      # Commit update.json do hlavní větve repozitáře.
      # Aplikace si tento soubor čte z raw GitHub URL při kontrole aktualizací.
      - name: Commitnout update.json do repozitáře
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update.json

          if git diff --cached --quiet; then
            echo "update.json se nezměnil."
          else
            git commit -m "Update release metadata v$VERSION"
            git push
          fi

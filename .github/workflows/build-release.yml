name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Verze bez písmene v, například 0.0.3"
        required: true
        default: "0.0.3"
      mode:
        description: "Režim spuštění"
        required: true
        type: choice
        default: "test_only"
        options:
          - test_only
          - release_after_approval

permissions:
  contents: write

env:
  APP_NAME: Sifrator_Mraveniste
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  LANG: "en_US.UTF-8"

jobs:
  source-check:
    name: Kontrola zdrojových souborů
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v6

      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Kontrola syntaxe všech Python souborů
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          ignored = {'.git', '.venv', 'venv', '.venv_build', 'build', 'dist', 'release', '__pycache__'}
          errors = []
          files = []

          for path in pathlib.Path('.').rglob('*.py'):
              if any(part in ignored for part in path.parts):
                  continue
              files.append(path)
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as error:
                  errors.append((path, error))

          print(f'Zkontrolováno Python souborů: {len(files)}')
          if errors:
              print('CHYBY:')
              for path, error in errors:
                  print(f' - {path}: {error}')
              sys.exit(1)

          print('Syntaxe všech Python souborů je OK.')
          PY

  build:
    name: Build a test ${{ matrix.platform }}
    needs: source-check
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-14
          - platform: macos-x64
            os: macos-15-intel

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v6

      - name: Nastavit Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Nastavit UTF-8 na Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: chcp 65001

      - name: Nastavit verzi
        shell: bash
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Zobrazit systém
        shell: bash
        run: |
          echo "Platforma: ${{ matrix.platform }}"
          echo "Runner OS: $RUNNER_OS"
          python --version
          python - <<'PY'
          import platform
          print('System:', platform.system())
          print('Machine:', platform.machine())
          PY

      - name: Nainstalovat knihovny
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ověřit hlavní soubory projektu
        shell: bash
        run: |
          test -f main.py
          test -f pirate_key_renderer.py
          test -f update_manager.py
          test -d icons
          test -d "logika sifer"

      - name: Aktualizovat APP_VERSION v main.py
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']
          path = Path('main.py')
          text = path.read_text(encoding='utf-8-sig')
          text, count = re.subn(r'^APP_VERSION\s*=\s*["\'].*?["\']', f'APP_VERSION = "{version}"', text, count=1, flags=re.MULTILINE)
          if count == 0:
              text = f'APP_VERSION = "{version}"\n' + text
          path.write_text(text, encoding='utf-8')
          print(f'APP_VERSION nastaveno na {version}')
          PY

      - name: Smoke test přímo ze zdrojáků
        shell: bash
        run: python main.py --smoke-test

      - name: Připravit ikony aplikace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          icons = Path('icons')
          logo = icons / 'logo.png'
          if not logo.exists():
              raise SystemExit('Chybí icons/logo.png')

          img = Image.open(logo).convert('RGBA')
          canvas = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          img.thumbnail((900, 900))
          canvas.paste(img, ((1024 - img.width) // 2, (1024 - img.height) // 2), img)

          ico = icons / 'app.ico'
          if not ico.exists():
              canvas.save(ico, sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])
              print('Vytvořeno icons/app.ico')
          else:
              print('OK: icons/app.ico už existuje')

          icns = icons / 'app.icns'
          if not icns.exists():
              try:
                  canvas.save(icns, format='ICNS')
                  print('Vytvořeno icons/app.icns')
              except Exception as error:
                  print(f'Upozornění: app.icns se nepodařilo vytvořit: {error}')
          else:
              print('OK: icons/app.icns už existuje')
          PY

      - name: Build aplikace přes PyInstaller
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          app_name = os.environ.get('APP_NAME', 'Sifrator_Mraveniste')
          platform_key = '${{ matrix.platform }}'
          sep = ';' if os.name == 'nt' else ':'

          for folder in ('build', 'dist'):
              path = Path(folder)
              if path.exists():
                  shutil.rmtree(path, ignore_errors=True)

          spec = Path(f'{app_name}.spec')
          if spec.exists():
              spec.unlink()

          cmd = [
              sys.executable, '-m', 'PyInstaller',
              '--noconfirm',
              '--clean',
              '--onedir',
              '--windowed',
              '--name', app_name,
          ]

          if os.name == 'nt':
              cmd += ['--contents-directory', '.']
              icon = Path('icons/app.ico')
          else:
              icon = Path('icons/app.icns')

          if icon.exists():
              cmd += ['--icon', str(icon)]

          cmd += [
              '--hidden-import', 'pirate_key_renderer',
              '--hidden-import', 'update_manager',
              '--add-data', f'icons{sep}icons',
              '--add-data', f'logika sifer{sep}logika sifer',
              '--add-data', f'update.json{sep}.',
              '--add-data', f'update_manager.py{sep}.',
              '--add-data', f'pirate_key_renderer.py{sep}.',
              'main.py',
          ]

          print(' '.join(cmd))
          subprocess.run(cmd, check=True)
          PY

      - name: Podepsat macOS aplikaci ad-hoc
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "dist/${APP_NAME}.app"
          file "dist/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"

      - name: Smoke test hotové aplikace
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          app_name = os.environ.get('APP_NAME', 'Sifrator_Mraveniste')
          platform_key = '${{ matrix.platform }}'

          if platform_key == 'windows-x64':
              exe = Path('dist') / app_name / f'{app_name}.exe'
              if not exe.exists():
                  raise SystemExit(f'Chybí EXE: {exe}')
              subprocess.run([str(exe), '--smoke-test'], check=True)
          else:
              exe = Path('dist') / f'{app_name}.app' / 'Contents' / 'MacOS' / app_name
              if not exe.exists():
                  raise SystemExit(f'Chybí macOS spustitelný soubor: {exe}')
              subprocess.run([str(exe), '--smoke-test'], check=True)
          PY

      - name: Zabalit a ověřit ZIP
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import shutil
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          app_name = os.environ.get('APP_NAME', 'Sifrator_Mraveniste')
          version = os.environ['VERSION']
          platform_key = '${{ matrix.platform }}'
          release = Path('release')
          release.mkdir(exist_ok=True)
          zip_name = f'{app_name}_{platform_key}_v{version}.zip'
          zip_path = release / zip_name

          if zip_path.exists():
              zip_path.unlink()

          if platform_key == 'windows-x64':
              src = Path('dist') / app_name
              exe = src / f'{app_name}.exe'
              if not exe.exists():
                  raise SystemExit(f'Chybí EXE: {exe}')
              with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for path in src.rglob('*'):
                      if path.is_file():
                          zf.write(path, path.relative_to(src))
          else:
              src = Path('dist') / f'{app_name}.app'
              if not src.exists():
                  raise SystemExit(f'Chybí APP: {src}')
              subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent', str(src), str(zip_path)], check=True)

          if zip_path.stat().st_size < 1024 * 1024:
              raise SystemExit(f'ZIP je podezřele malý: {zip_path.stat().st_size} B')
          if zip_path.stat().st_size > 500 * 1024 * 1024:
              raise SystemExit(f'ZIP je podezřele velký: {zip_path.stat().st_size} B')

          with tempfile.TemporaryDirectory() as td:
              tmp = Path(td)
              with zipfile.ZipFile(zip_path, 'r') as zf:
                  zf.extractall(tmp)
              if platform_key == 'windows-x64':
                  expected = tmp / f'{app_name}.exe'
              else:
                  expected = tmp / f'{app_name}.app'
              if not expected.exists():
                  raise SystemExit(f'ZIP má špatnou strukturu, chybí: {expected}')

          sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          sha_file = release / f'{zip_name}.sha256'
          sha_file.write_text(f'{sha}  {zip_name}\n', encoding='utf-8')

          print(f'ZIP: {zip_path}')
          print(f'SHA256: {sha}')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'### {platform_key}\n')
              f.write(f'- ZIP: `{zip_name}`\n')
              f.write(f'- SHA256: `{sha}`\n')
              f.write(f'- Velikost: `{zip_path.stat().st_size}` B\n\n')
          PY

      - name: Nahrát artifact pro release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  summary:
    name: Souhrn testu
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout artifacty
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Vypsat výsledek
        shell: bash
        run: |
          echo "Stažené soubory:"
          find all-artifacts -type f -maxdepth 2 -print
          echo "### Souhrn buildu" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Režim: `${{ inputs.mode }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verze: `${{ inputs.version }}`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Všechny platformní buildy doběhly úspěšně." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release and update.json
    needs: summary
    if: ${{ inputs.mode == 'release_after_approval' }}
    runs-on: ubuntu-latest
    environment: release-approval

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stáhnout artifacty
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Připravit update.json a SHA256SUMS.txt
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          repo = os.environ['REPOSITORY']
          tag = f'v{version}'
          base_url = f'https://github.com/{repo}/releases/download/{tag}'
          app_name = os.environ.get('APP_NAME', 'Sifrator_Mraveniste')

          root = Path('all-artifacts')
          required = ['windows-x64', 'macos-arm64', 'macos-x64']
          platforms = {}
          sha_lines = []

          for platform_key in required:
              matches = sorted(root.rglob(f'{app_name}_{platform_key}_v{version}.zip'))
              if not matches:
                  raise SystemExit(f'Chybí ZIP pro {platform_key}')
              zip_path = matches[0]
              sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
              file_name = zip_path.name
              platforms[platform_key] = {
                  'package_url': f'{base_url}/{file_name}',
                  'sha256': sha,
                  'file_name': file_name,
              }
              sha_lines.append(f'{sha}  {file_name}')
              print(f'{platform_key}: {file_name} {sha}')

          data = {
              'version': version,
              'notes': f'Nová verze {version}.',
              'platforms': platforms,
          }

          Path('update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          if not Path('README_PRVNI_SPUSTENI.txt').exists():
              Path('README_PRVNI_SPUSTENI.txt').write_text('Šifrátor Mraveniště – první spuštění\n', encoding='utf-8')
          PY

      - name: Vytvořit poznámky k release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<EOF_NOTES
          Nová verze $VERSION.

          Balíčky:
          - Windows x64
          - macOS Apple Silicon arm64
          - macOS Intel x64

          Součástí release je také:
          - update.json
          - SHA256SUMS.txt
          - README_PRVNI_SPUSTENI.txt
          EOF_NOTES

      - name: Vytvořit nebo najít GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG už existuje."
          else
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          fi

      - name: Nahrát soubory do Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          gh release upload "$TAG" all-artifacts/*.zip update.json SHA256SUMS.txt README_PRVNI_SPUSTENI.txt --clobber

      - name: Commitnout update.json a SHA256SUMS.txt
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "update.json / SHA256SUMS.txt se nezměnily."
          else
            git commit -m "Update release metadata v$VERSION"
            git push
          fi

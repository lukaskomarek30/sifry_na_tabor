name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Verze bez písmene v, nebo auto = další patch podle posledního tagu"
        required: true
        default: "auto"
      mode:
        description: "Režim spuštění"
        required: true
        type: choice
        default: "release_after_approval"
        options:
          - test_only
          - release_after_approval

permissions:
  contents: write

env:
  APP_NAME: Sifrator_Mraveniste
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  LANG: "en_US.UTF-8"

jobs:
  resolve-version:
    name: Určení nové verze
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      latest_tag: ${{ steps.resolve.outputs.latest_tag }}
      requested_version: ${{ steps.resolve.outputs.requested_version }}

    steps:
      - name: Stáhnout repozitář a tagy
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Zjistit nejnovější verzi
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          git fetch --tags --force
          python - <<'PY'
          import os
          import re
          import subprocess

          requested = (os.environ.get('REQUESTED_VERSION') or 'auto').strip()

          def parse_version(value: str):
              nums = [int(x) for x in re.findall(r'\d+', value or '')[:3]]
              while len(nums) < 3:
                  nums.append(0)
              return tuple(nums)

          def get_latest_tag():
              try:
                  raw = subprocess.check_output(
                      ['git', 'tag', '--list', 'v*'],
                      text=True,
                      encoding='utf-8',
                      errors='replace',
                  )
              except Exception:
                  raw = ''

              tags = [line.strip() for line in raw.splitlines() if line.strip()]
              semver_tags = []
              for tag in tags:
                  if re.match(r'^v?\d+\.\d+\.\d+(?:[-_].*)?$', tag):
                      semver_tags.append(tag)

              if not semver_tags:
                  return 'v0.0.0'

              return sorted(semver_tags, key=parse_version)[-1]

          latest_tag = get_latest_tag()

          if requested.lower() in ('auto', 'next', 'patch', ''):
              major, minor, patch = parse_version(latest_tag)
              patch += 1
              version = f'{major}.{minor}.{patch}'
              mode_text = 'automaticky další patch verze'
          else:
              version = requested.lstrip('vV').strip()
              mode_text = 'ručně zadaná verze'

          if not re.match(r'^\d+\.\d+\.\d+(?:[-_][A-Za-z0-9.]+)?$', version):
              raise SystemExit(f'Neplatný formát verze: {version}. Použij například 0.0.4 nebo auto.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as file:
              file.write(f'version={version}\n')
              file.write(f'latest_tag={latest_tag}\n')
              file.write(f'requested_version={requested}\n')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as file:
              file.write('## Určení verze\n\n')
              file.write(f'- Zadaná hodnota v okně: `{requested}`\n')
              file.write(f'- Nejnovější nalezený tag: `{latest_tag}`\n')
              file.write(f'- Režim: `{mode_text}`\n')
              file.write(f'- Výsledná verze pro build/release: `v{version}`\n\n')

          print(f'Zadaná hodnota: {requested}')
          print(f'Nejnovější tag: {latest_tag}')
          print(f'Výsledná verze: v{version}')
          PY

  source-check:
    name: Kontrola zdrojových souborů
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v6

      - name: Nastavit Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Kontrola syntaxe všech Python souborů
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          ignored = {'.git', '.venv', 'venv', '.venv_build', 'build', 'dist', 'release', '__pycache__'}
          errors = []
          files = []

          for path in pathlib.Path('.').rglob('*.py'):
              if any(part in ignored for part in path.parts):
                  continue
              files.append(path)
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as error:
                  errors.append((path, error))

          print(f'Zkontrolováno Python souborů: {len(files)}')
          if errors:
              print('CHYBY:')
              for path, error in errors:
                  print(f' - {path}: {error}')
              sys.exit(1)

          print('Syntaxe všech Python souborů je OK.')
          PY

  build:
    name: Build a test ${{ matrix.platform }}
    needs: [resolve-version, source-check]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-14
          - platform: macos-x64
            os: macos-15-intel

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v6

      - name: Nastavit Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Nastavit UTF-8 na Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: chcp 65001

      - name: Nastavit verzi
        shell: bash
        run: |
          echo "VERSION=${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=${{ needs.resolve-version.outputs.latest_tag }}" >> "$GITHUB_ENV"
          echo "Používám verzi: ${{ needs.resolve-version.outputs.version }}"
          echo "Nejnovější tag byl: ${{ needs.resolve-version.outputs.latest_tag }}"

      - name: Zobrazit systém
        shell: bash
        run: |
          echo "Platforma: ${{ matrix.platform }}"
          echo "Runner OS: $RUNNER_OS"
          python --version
          python - <<'PY'
          import platform
          print('System:', platform.system())
          print('Machine:', platform.machine())
          PY

      - name: Nainstalovat knihovny
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ověřit hlavní soubory projektu
        shell: bash
        run: |
          test -f main.py
          test -f pirate_key_renderer.py
          test -f update_manager.py
          test -d icons
          test -d "logika sifer"

      - name: Aktualizovat APP_VERSION v main.py
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']
          path = Path('main.py')
          text = path.read_text(encoding='utf-8-sig')
          text, count = re.subn(r'^APP_VERSION\s*=\s*["\'].*?["\']', f'APP_VERSION = "{version}"', text, count=1, flags=re.MULTILINE)
          if count == 0:
              text = f'APP_VERSION = "{version}"\n' + text
          path.write_text(text, encoding='utf-8')
          print(f'APP_VERSION nastaveno na {version}')
          PY

      - name: Smoke test přímo ze zdrojáků
        shell: bash
        run: python main.py --smoke-test

      - name: Připravit ikony aplikace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          icons = Path('icons')
          logo = icons / 'logo.png'
          if not logo.exists():
              raise SystemExit('Chybí icons/logo.png')

          img = Image.open(logo).convert('RGBA')
          canvas = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          img.thumbnail((900, 900))
          canvas.paste(img, ((1024 - img.width) // 2, (1024 - img.height) // 2), img)

          ico = icons / 'app.ico'
          if not ico.exists():
              canvas.save(ico, sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])
              print('Vytvořeno icons/app.ico')
          else:
              print('OK: icons/app.ico už existuje')

          icns = icons / 'app.icns'
          if not icns.exists():
              try:
                  canvas.save(icns, format='ICNS')
                  print('Vytvořeno icons/app.icns')
              except Exception as error:
                  print(f'Upozornění: app.icns se nepodařilo vytvořit: {error}')
          else:
              print('OK: icons/app.icns už existuje')
          PY

      - name: Build aplikace přes PyInstaller
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          app_name = os.environ.get('APP_NAME', 'Sifrator_Mraveniste')
          platform_key = '${{ matrix.platform }}'
          sep = ';' if os.name == 'nt' else ':'

          for folder in ('build', 'dist'):
              path = Path(folder)
              if path.exists():
                  shutil.rmtree(path, ignore_errors=True)

          spec = Path(f'{app_name}.spec')
          if spec.exists():
              spec.unlink()

          cmd = [
              sys.executable, '-m', 'PyInstaller',
              '--noconfirm',
              '--clean',
              '--onedir',
              '--windowed',
              '--name', app_name,
          ]

          if os.name == 'nt':
              cmd += ['--contents-directory', '.']
              icon = Path('icons/app.ico')
          else:
              icon = Path('icons/app.icns')

          if icon.exists():
              cmd += ['--icon', str(icon)]

          cmd += [
              '--hidden-import', 'pirate_key_renderer',
              '--hidden-import', 'update_manager',
              '--add-data', f'icons{sep}icons',
              '--add-data', f'logika sifer{sep}logika sifer',
              '--add-data', f'update.json{sep}.',
              '--add-data', f'update_manager.py{sep}.',
              '--add-data', f'pirate_key_renderer.py{sep}.',
              'main.py',
          ]

          print(' '.join(cmd))
          subprocess.run(cmd, check=True)
          PY

      - name: Podepsat macOS aplikaci ad-hoc
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "dist/${APP_NAME}.app"
          file "dist/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"

      - name: Smoke test hotové aplikace
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          app_name = os.environ.get('APP_NAME', 'Sifrator_Mraveniste')
          platform_key = '${{ matrix.platform }}'

          if platform_key == 'windows-x64':
              exe = Path('dist') / app_name / f'{app_name}.exe'
              if not exe.exists():
                  raise SystemExit(f'Chybí EXE: {exe}')
              subprocess.run([str(exe), '--smoke-test'], check=True)
          else:
              exe = Path('dist') / f'{app_name}.app' / 'Contents' / 'MacOS' / app_name
              if not exe.exists():
                  raise SystemExit(f'Chybí macOS spustitelný soubor: {exe}')
              subprocess.run([str(exe), '--smoke-test'], check=True)
          PY

      - name: Zabalit a ověřit ZIP
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import shutil
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          app_name = os.environ.get('APP_NAME', 'Sifrator_Mraveniste')
          version = os.environ['VERSION']
          platform_key = '${{ matrix.platform }}'
          release = Path('release')
          release.mkdir(exist_ok=True)
          zip_name = f'{app_name}_{platform_key}_v{version}.zip'
          zip_path = release / zip_name

          if zip_path.exists():
              zip_path.unlink()

          if platform_key == 'windows-x64':
              src = Path('dist') / app_name
              exe = src / f'{app_name}.exe'
              if not exe.exists():
                  raise SystemExit(f'Chybí EXE: {exe}')
              with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for path in src.rglob('*'):
                      if path.is_file():
                          zf.write(path, path.relative_to(src))
          else:
              src = Path('dist') / f'{app_name}.app'
              if not src.exists():
                  raise SystemExit(f'Chybí APP: {src}')
              subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent', str(src), str(zip_path)], check=True)

          if zip_path.stat().st_size < 1024 * 1024:
              raise SystemExit(f'ZIP je podezřele malý: {zip_path.stat().st_size} B')
          if zip_path.stat().st_size > 500 * 1024 * 1024:
              raise SystemExit(f'ZIP je podezřele velký: {zip_path.stat().st_size} B')

          with tempfile.TemporaryDirectory() as td:
              tmp = Path(td)
              with zipfile.ZipFile(zip_path, 'r') as zf:
                  zf.extractall(tmp)
              if platform_key == 'windows-x64':
                  expected = tmp / f'{app_name}.exe'
              else:
                  expected = tmp / f'{app_name}.app'
              if not expected.exists():
                  raise SystemExit(f'ZIP má špatnou strukturu, chybí: {expected}')

          sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          sha_file = release / f'{zip_name}.sha256'
          sha_file.write_text(f'{sha}  {zip_name}\n', encoding='utf-8')

          print(f'ZIP: {zip_path}')
          print(f'SHA256: {sha}')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'### {platform_key}\n')
              f.write(f'- ZIP: `{zip_name}`\n')
              f.write(f'- SHA256: `{sha}`\n')
              f.write(f'- Velikost: `{zip_path.stat().st_size}` B\n\n')
          PY

      - name: Nahrát artifact pro release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  summary:
    name: Souhrn testu
    needs: [resolve-version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout artifacty
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Vypsat výsledek
        shell: bash
        run: |
          echo "Stažené soubory:"
          find all-artifacts -type f -maxdepth 2 -print
          echo "### Souhrn buildu" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Režim: `${{ inputs.mode }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Zadaná verze: `${{ needs.resolve-version.outputs.requested_version }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nejnovější tag: `${{ needs.resolve-version.outputs.latest_tag }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Použitá verze: `v${{ needs.resolve-version.outputs.version }}`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Všechny platformní buildy doběhly úspěšně." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release and update.json
    needs: [resolve-version, summary]
    if: ${{ inputs.mode == 'release_after_approval' }}
    runs-on: ubuntu-latest
    environment: release-approval

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stáhnout artifacty
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Připravit update.json a SHA256SUMS.txt
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          repo = os.environ['REPOSITORY']
          tag = f'v{version}'
          base_url = f'https://github.com/{repo}/releases/download/{tag}'
          app_name = os.environ.get('APP_NAME', 'Sifrator_Mraveniste')

          root = Path('all-artifacts')
          required = ['windows-x64', 'macos-arm64', 'macos-x64']
          platforms = {}
          sha_lines = []

          for platform_key in required:
              matches = sorted(root.rglob(f'{app_name}_{platform_key}_v{version}.zip'))
              if not matches:
                  raise SystemExit(f'Chybí ZIP pro {platform_key}')
              zip_path = matches[0]
              sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
              file_name = zip_path.name
              platforms[platform_key] = {
                  'package_url': f'{base_url}/{file_name}',
                  'sha256': sha,
                  'file_name': file_name,
              }
              sha_lines.append(f'{sha}  {file_name}')
              print(f'{platform_key}: {file_name} {sha}')

          data = {
              'version': version,
              'notes': f'Nová verze {version}.',
              'platforms': platforms,
          }

          Path('update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          if not Path('README_PRVNI_SPUSTENI.txt').exists():
              Path('README_PRVNI_SPUSTENI.txt').write_text('Šifrátor Mraveniště – první spuštění\n', encoding='utf-8')
          PY

      - name: Vytvořit profesionální poznámky k release
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ['VERSION']
          repo = os.environ['REPOSITORY']
          server_url = os.environ.get('GITHUB_SERVER_URL', 'https://github.com')
          tag = f'v{version}'
          app_name = os.environ.get('APP_NAME', 'Sifrator_Mraveniste')

          def run_git(args, default=''):
              try:
                  return subprocess.check_output(['git', *args], text=True, encoding='utf-8', errors='replace').strip()
              except Exception:
                  return default

          def version_key(value):
              value = value.lstrip('vV')
              parts = re.findall(r'\d+', value)
              nums = tuple(int(x) for x in parts[:4])
              return nums + (0,) * (4 - len(nums))

          tags_raw = run_git(['tag', '--list', 'v*', '--sort=version:refname'])
          tags = [line.strip() for line in tags_raw.splitlines() if line.strip()]
          current_key = version_key(tag)
          older_tags = [t for t in tags if version_key(t) < current_key]
          previous_tag = older_tags[-1] if older_tags else ''

          if previous_tag:
              commit_range = f'{previous_tag}..HEAD'
              full_changelog = f'{server_url}/{repo}/compare/{previous_tag}...{tag}'
          else:
              commit_range = 'HEAD'
              full_changelog = f'{server_url}/{repo}/commits/{os.environ.get("GITHUB_SHA", "HEAD")}'

          log_format = '%h%x09%s%x09%an'
          if previous_tag:
              commits_raw = run_git(['log', '--no-merges', '--pretty=format:' + log_format, commit_range])
          else:
              commits_raw = run_git(['log', '--no-merges', '--pretty=format:' + log_format, '-n', '50'])

          categories = {
              'Nové funkce a UI': [],
              'Opravy chyb': [],
              'Build, testy a release': [],
              'Dokumentace': [],
              'Ostatní změny': [],
          }

          for line in commits_raw.splitlines():
              parts = line.split('	')
              if len(parts) < 2:
                  continue
              sha, subject = parts[0], parts[1]
              subject_clean = subject.strip()
              lower = subject_clean.lower()
              item = f'- `{sha}` {subject_clean}'
              if lower.startswith(('feat:', 'feature:', 'ui:', 'add:', 'new:')) or 'responsive' in lower or 'responz' in lower:
                  categories['Nové funkce a UI'].append(item)
              elif lower.startswith(('fix:', 'bug:', 'hotfix:', 'oprava:', 'repair:')) or 'fix' in lower or 'oprav' in lower:
                  categories['Opravy chyb'].append(item)
              elif lower.startswith(('build:', 'ci:', 'actions:', 'release:', 'workflow:', 'test:')) or any(word in lower for word in ['github actions', 'workflow', 'build', 'release', 'test']):
                  categories['Build, testy a release'].append(item)
              elif lower.startswith(('docs:', 'doc:', 'readme:')) or 'readme' in lower or 'návod' in lower or 'navod' in lower:
                  categories['Dokumentace'].append(item)
              else:
                  categories['Ostatní změny'].append(item)

          def file_size(path: Path) -> str:
              size = path.stat().st_size
              units = ['B', 'KB', 'MB', 'GB']
              value = float(size)
              for unit in units:
                  if value < 1024 or unit == units[-1]:
                      if unit == 'B':
                          return f'{int(value)} {unit}'
                      return f'{value:.1f} {unit}'
                  value /= 1024
              return f'{size} B'

          zips = []
          root = Path('all-artifacts')
          for platform_key, label, target in [
              ('windows-x64', 'Windows x64', 'Windows 10/11 x64'),
              ('macos-arm64', 'macOS Apple Silicon arm64', 'Mac M1/M2/M3/M4/A18 Pro'),
              ('macos-x64', 'macOS Intel x64', 'Starší Intel Mac'),
          ]:
              matches = sorted(root.rglob(f'{app_name}_{platform_key}_v{version}.zip'))
              if not matches:
                  raise SystemExit(f'Chybí ZIP pro {platform_key}')
              path = matches[0]
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              zips.append((label, path.name, target, file_size(path), sha))

          lines = []
          lines.append(f'# Šifrátor Mraveniště {tag}')
          lines.append('')
          lines.append(f'Nová verze aplikace **Šifrátor Mraveniště** `{tag}`.')
          lines.append('')
          lines.append('## Stav vydání')
          lines.append('')
          lines.append('| Kontrola | Stav |')
          lines.append('|---|---|')
          lines.append('| Windows x64 build | ✅ OK |')
          lines.append('| macOS Apple Silicon arm64 build | ✅ OK |')
          lines.append('| macOS Intel x64 build | ✅ OK |')
          lines.append('| Smoke test zdrojových souborů | ✅ OK |')
          lines.append('| Smoke test hotových aplikací | ✅ OK |')
          lines.append('| ZIP struktura | ✅ OK |')
          lines.append('| SHA256 kontrola | ✅ OK |')
          lines.append('| update.json | ✅ OK |')
          lines.append('')
          lines.append('## Stažení')
          lines.append('')
          lines.append('| Systém | Soubor | Pro koho | Velikost |')
          lines.append('|---|---|---|---:|')
          for label, filename, target, size, sha in zips:
              lines.append(f'| {label} | `{filename}` | {target} | {size} |')
          lines.append('')
          lines.append('## Co je nového')
          lines.append('')
          any_commit = False
          for title, items in categories.items():
              if not items:
                  continue
              any_commit = True
              lines.append(f'### {title}')
              lines.append('')
              for item in items[:30]:
                  lines.append(item)
              if len(items) > 30:
                  lines.append(f'- …a dalších {len(items) - 30} změn')
              lines.append('')
          if not any_commit:
              lines.append('- Pro tuto verzi se nepodařilo automaticky načíst seznam commitů.')
              lines.append('')
          lines.append('## SHA256')
          lines.append('')
          lines.append('```text')
          for label, filename, target, size, sha in zips:
              lines.append(f'{sha}  {filename}')
          lines.append('```')
          lines.append('')
          lines.append('## První spuštění')
          lines.append('')
          lines.append('- **Windows:** stáhni `windows-x64`, rozbal ZIP a spusť aplikaci.')
          lines.append('- **Mac Apple Silicon:** stáhni `macos-arm64`.')
          lines.append('- **Mac Intel:** stáhni `macos-x64`.')
          lines.append('')
          lines.append('Aplikace pro macOS zatím není notarizovaná přes Apple Developer Program. Pokud macOS zobrazí upozornění o neidentifikovaném vývojáři, postupuj podle souboru `README_PRVNI_SPUSTENI.md` nebo `README_PRVNI_SPUSTENI.txt`.')
          lines.append('')
          raw_base = f'https://raw.githubusercontent.com/{repo}/main/docs/img'
          lines.append('### macOS – povolení prvního spuštění')
          lines.append('')
          lines.append('1. Pokud se zobrazí hláška o neidentifikovaném vývojáři, klikni na **OK**.')
          lines.append('')
          lines.append(f'![macOS blocked]({raw_base}/macos_01_blocked_unidentified_developer.png)')
          lines.append('')
          lines.append('2. Otevři **System Settings → Privacy & Security** a klikni na **Open Anyway**.')
          lines.append('')
          lines.append(f'![macOS Privacy & Security]({raw_base}/macos_03_privacy_security_open_anyway.png)')
          lines.append('')
          lines.append('3. Potvrď spuštění tlačítkem **Open**.')
          lines.append('')
          lines.append(f'![macOS Open]({raw_base}/macos_02_open_confirmation.png)')
          lines.append('')
          lines.append('## Automatické aktualizace')
          lines.append('')
          lines.append('Součástí vydání je `update.json`, který používá automatický updater aplikace.')
          lines.append('')
          if previous_tag:
              lines.append(f'## Porovnání změn')
              lines.append('')
              lines.append(f'**Full changelog:** {full_changelog}')
          else:
              lines.append('## Porovnání změn')
              lines.append('')
              lines.append('Toto je první tag, který workflow našlo pro porovnání.')

          notes = '\n'.join(lines).strip() + '\n'
          Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          print(notes)

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(notes)
          PY

      - name: Vytvořit nebo aktualizovat GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG už existuje, aktualizuji poznámky."
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          fi

      - name: Nahrát soubory do Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          TAG="v$VERSION"
          ASSETS=(all-artifacts/*.zip update.json SHA256SUMS.txt)

          if [ -f README_PRVNI_SPUSTENI.md ]; then
            ASSETS+=(README_PRVNI_SPUSTENI.md)
          fi

          if [ -f README_PRVNI_SPUSTENI.txt ]; then
            ASSETS+=(README_PRVNI_SPUSTENI.txt)
          fi

          if compgen -G "docs/img/*.png" > /dev/null; then
            ASSETS+=(docs/img/*.png)
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --clobber

      - name: Commitnout update.json a SHA256SUMS.txt
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "update.json / SHA256SUMS.txt se nezměnily."
          else
            git commit -m "Update release metadata v$VERSION"
            git push
          fi
